<div class="login-page">
  <div class="login-box">
    <div class="brand-header">
      <div class="brand-badge">🛒 GROCERY POS SAAS</div>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to manage your grocery stores, branches, and staff</p>
    </div>

    <div *ngIf="errorMessage" class="alert-box alert-danger">
      <span>⚠️</span>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input
          type="email"
          formControlName="email"
          class="form-control"
          placeholder="e.g. superadmin@grocerypos.com"
          [class.is-invalid]="submitted && f['email'].errors"
        />
        <div *ngIf="submitted && f['email'].errors" class="form-error">
          <span *ngIf="f['email'].errors['required']">Email is required</span>
          <span *ngIf="f['email'].errors['email']">Enter a valid email address</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="Enter your password"
          [class.is-invalid]="submitted && f['password'].errors"
        />
        <div *ngIf="submitted && f['password'].errors" class="form-error">
          <span *ngIf="f['password'].errors['required']">Password is required</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        <span>{{ loading ? 'Signing In...' : 'Sign In' }}</span>
      </button>
    </form>

    <div class="quick-credentials">
      <div class="cred-title">Quick Test Credentials</div>
      <button (click)="fillSuperAdmin()" class="cred-pill" type="button">
        👑 Super Admin Demo
      </button>
    </div>
  </div>
</div>
